name: Publicar Anderus Nexus no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Gerar identificação do build publicado
        run: |
          printf '{"sha":"%s","publishedAt":"%s"}\\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build-meta.json
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
