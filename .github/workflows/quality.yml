name: Validar Nexus v0.9
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe, temas, OCR e cobertura de modos
        run: node scripts/check-v09.mjs
      - name: Validar identificação por commit e cache da PWA
        run: |
          node --check sw.js
          node scripts/check-release-stamp.mjs
      - name: Fase 3.2 — conferência do cartão HoYoLab da Robin
        run: |
          node --check illustrated-showcase-import.js
          node scripts/check-hoyolab-robin.mjs
          node scripts/check-hoyolab-one-character-import.mjs
      - name: Fase 3 — scanner não destrutivo e seis relíquias
        run: |
          node --check nexus-account-engine.js
          node --check relic-inspector.js
          node --check illustrated-showcase-import.js
          node --check v06.js
          node scripts/check-scan-safety.mjs
      - name: Migração de relíquias, cones S1-S5 e análise de conta
        run: node scripts/check-account.mjs
      - name: Verificar se o Cloudflare já publicou o novo serviço
        continue-on-error: true
        run: node scripts/check-cloud-sync-deployment.mjs
      - name: Fase 2 — conferir login publicado antes de liberar a tela
        run: |
          node --check nexus-login.js
          node scripts/check-login-deployment.mjs
      - name: Fase 2 — validar acesso criptografado
        run: |
          node --check worker/login-room.js
          node --check worker/index.js
          node --check nexus-login-core.js
          node scripts/check-login-core.mjs
      - name: Fase 2 — empacotamento seguro do Worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/nexus-auth-release
        working-directory: worker
      - name: Sincronização real — criptografia, união e conflito
        run: |
          node --check nexus-sync-core.js
          node --check nexus-cloud-sync.js
          node --check worker/sync-room.js
          node --check worker/index.js
          node scripts/check-cloud-sync.mjs
          node scripts/check-cloud-sync-worker.mjs
      - name: Etapa 1 — versão e restauração segura de dados
        run: |
          node --check nexus-diagnostics.js
          node --check nexus-backup.js
          node scripts/check-backup.mjs

      - name: Servidor de conta compartilhada
        run: |
          node --check worker/index.js
          node --check worker/sync-room.js
          node scripts/check-cloud-sync-worker.mjs
