name: Validar experiência no celular e desktop
on:
  push:
    branches: [main]
    paths:
      - 'v06.js'
      - 'nexus-account-engine.js'
      - 'nexus-scan-v3-core.js'
      - 'nexus-scan-v3-reader.js'
      - 'nexus-scan-v3-ui.js'
      - 'nexus-scan-v3.css'
      - 'nexus-design-system.css'
      - 'nexus-visual-finish.css'
      - 'nexus-visual-finish.js'
      - 'nexus-visual-experience.css'
      - 'nexus-visual-experience.js'
      - 'nexus-theme-studio-v3.css'
      - 'nexus-theme-studio-v3.js'
      - 'themes/generated/**'
      - 'scripts/browser-theme-studio-v3.mjs'
      - 'scripts/browser-hub-theme-studio.mjs'
      - 'scripts/browser-visual-finish.mjs'
      - 'index.html'
      - 'nexus-v07.js'
      - 'nexus-v09.js'
      - 'themes/aha.css'
      - 'themes/aha.js'
      - 'themes/aha-detail.css'
      - 'themes/aha-detail.js'
      - 'data/beta-editorial.json'
      - 'scripts/browser-visual-completion.mjs'
      - 'nexus-design-system.js'
      - 'scripts/browser-design-system.mjs'
      - 'scripts/browser-scan-v3.mjs'
      - 'relic-inspector.js'
      - 'illustrated-showcase-import.js'
      - 'scripts/browser-scan-safety.mjs'
      - 'nexus-account.css'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/browser-login-join.mjs'
      - 'nexus-login.js'
      - 'nexus-cloud-sync.js'
      - 'scripts/browser-offline.mjs'
      - 'scripts/stamp-release.mjs'
      - 'sw.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/browser-ux.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-ux-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          # Ubuntu GitHub runners already include Chromium system libraries.
          # Avoid apt font packages here: a transient Ubuntu mirror DNS failure
          # previously blocked the entire visual suite before any tests ran.
          npx playwright install chromium
      - name: Testar conta, cone, relíquias e persistência em 390px e 1440px
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/nexus-browser-server.log 2>&1 &
          node scripts/browser-smoke.mjs
          node scripts/browser-offline.mjs
          node scripts/browser-sync.mjs
          node scripts/browser-login-join.mjs

      - name: Nexus Scan 3 — testar importação real no navegador com dados simulados
        run: node scripts/browser-scan-v3.mjs
      - name: Fase 4 — validar 320 a 1920 px e navegação acessível
        run: node scripts/browser-design-system.mjs
      - name: Visual completo — Aha, prévia e todas as seções
        run: node scripts/browser-visual-completion.mjs
      - name: Nome oficial Aha e navegação vetorial
        run: node scripts/browser-visual-finish.mjs
      - name: Hub inteiro e Theme Studio — experiência em quatro telas
        run: node scripts/browser-hub-theme-studio.mjs
      - name: Nexus 2.0 — validar nova aplicação, scripts e integração local
        run: |
          node --check v2/core.js
          node --check v2/screens.js
          node --check v2/modules.js
          node scripts/browser-nexus2.mjs
      - name: Theme Studio 3 — testar criação, galeria, prévia e Eidolons do original
        run: node scripts/browser-theme-studio-v3.mjs
      - name: Guardar capturas para auditoria visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-browser-ux
          path: artifacts/*.png
          if-no-files-found: ignore
