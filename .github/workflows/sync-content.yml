name: Atualizar catalogo do Pom-Pom
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_game.py'
      - 'scripts/sync_ascension.py'
      - 'scripts/sync_eidolon_art.py'
      - 'scripts/generate_relic_signatures.py'
      - '.github/workflows/sync-content.yml'
permissions:
  contents: write
concurrency:
  group: pompom-sync
  cancel-in-progress: false
jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência leve para as imagens das relíquias
        run: python -m pip install --quiet 'Pillow>=10.0'
      - name: Verificar personagens habilidades e Eidolons
        run: python scripts/sync_game.py
      - name: Sincronizar materiais de ascensão para o Farm Planner
        run: python scripts/sync_ascension.py
      - name: Atualizar todas as artes reais dos Eidolons
        run: python scripts/sync_eidolon_art.py
      - name: Sincronizar assinaturas dos novos conjuntos de relíquias
        run: python scripts/generate_relic_signatures.py
      - name: Salvar snapshot e publicar
        run: |
          git config user.name "Anderus Catalog Bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza catalogo do Pom-Pom [bot]"
            git push origin HEAD:main
          fi
