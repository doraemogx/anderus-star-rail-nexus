${section('Radar do Nexus','Dentro do site')}<div class="card card-body"><div class="ticker"><span class="ticker-icon">${ic('refresh')}</span><div><strong>Catálogo de kits e Eidolons</strong><p>${syncStatus==='online'?'Conexão com os dados comunitários estabelecida; os detalhes abrem dentro do Nexus.':'Dados detalhados para Evanescia, Pearl e Mortenax Blade disponíveis offline. O restante pode ser consultado quando a sincronização carregar.'}</p><button class="button secondary sm mt10" onclick="route('radar')">Abrir radar ${ic('chevron')}</button></div></div></div>${foot()}`}
function library(){let all=CATS.filter(x=>x.id!=='future-aha');if(libraryFilter==='owned')all=all.filter(c=>state.characters[c.id]);if(libraryFilter==='favorites')all=all.filter(c=>state.favorites.includes(c.id));if(libSearch)all=all.filter(c=>c.name.toLowerCase().includes(libSearch.toLowerCase()));return `${head('BANCO DE DADOS','Arquivo de Personagens','Todos os personagens reunidos em um só lugar. Abra uma ficha para explorar kits, Eidolons, rastros e estatísticas.')}
<div class="chips">${[['owned','Minha conta'],['all','Todos os personagens'],['favorites','Favoritos']].map(([k,l])=>`<button class="chip ${libraryFilter===k?'active':''}" onclick="libraryFilter='${k}';refresh()">${l}</button>`).join('')}</div><div class="catalog-search" style="margin:9px 0 14px">${ic('search')}<input type="search" id="librarySearch" placeholder="Buscar personagem..." value="${esc(libSearch)}" oninput="libSearch=this.value;updateLibrary()"></div>
<div class="library-grid" id="libraryGrid">${makeLibraryGrid(all)}</div><div class="note mt14">Você possui ${owned().length} personagens cadastrados nesta versão. É possível adicionar qualquer um à sua conta ao abrir a ficha e tocar em “Adicionar à conta”.</div>${foot()}`}
function makeLibraryGrid(items){return items.map(c=>`<button class="library-card" onclick="openProfile('${c.id}')"><div class="face-placeholder">${c.name[0]}<img class="face" style="position:absolute;top:0;left:0" loading="lazy" src="${esc(imgSrc(c.id,'icon'))}" onerror="this.style.display='none'" alt="${esc(c.name)}"></div>${state.characters[c.id]?`<span class="own-dot">E${state.characters[c.id].e}S${state.characters[c.id].s}</span>`:''}<span class="char-name">${esc(c.name)}</span></button>`).join('')||'<div class="note" style="grid-column:1/-1">Nenhum personagem neste filtro.</div>'}
function updateLibrary(){let items=CATS.filter(c=>!libSearch||c.name.toLowerCase().includes(libSearch.toLowerCase()));if(libraryFilter==='owned')items=items.filter(c=>state.characters[c.id]);if(libraryFilter==='favorites')items=items.filter(c=>state.favorites.includes(c.id));document.getElementById('libraryGrid').innerHTML=makeLibraryGrid(items)}
function openProfile(id){state.profile=id;save();tab='overview';route('profile')}
function rankInfo(id,n){let k=id+String(n).padStart(2,'0');let remote=gameData.ranks[k];if(remote)return {...remote,source:'catálogo completo',icon:remote.icon};const local=SEED_RANKS[id]?.[n-1];if(local)return {id:k,name:local[0],desc:local[1],source:'catálogo local',icon:`icon/skill/${id}_rank${n}.png`};return {id:k,name:`Eidolon ${n}`,desc:'Os dados deste Eidolon ainda não foram carregados. Conecte-se à internet e atualize o catálogo para visualizar a descrição do jogo.',source:'aguardando sincronização',icon:`icon/skill/${id}_rank${n}.png`}}
function artRank(id,n){let item=rankInfo(id,n);return STR+(item.icon||`icon/skill/${id}_rank${n}.png`)}
function ownedBuild(id){return state.characters[id]||null}
function profile(){let id=state.profile||'1505',c=lookup(id),b=ownedBuild(id);return `<div class="char-banner"><button class="i-btn char-back" aria-label="Voltar ao arquivo" onclick="route('library')">${ic('back')}</button>${photo(id,'art','hero')}<div class="char-meta"><div class="eyebrow">✧ ARQUIVO / PERSONAGEM</div><h1>${esc(c.name)}</h1><div class="tags"><span class="badge">${b?'Nv. '+b.level:'Não registrado'}</span><span class="badge">${b?'E'+b.e+'S'+b.s:'Não está na conta'}</span><span class="badge">✦ Dados do jogo</span></div></div></div>
<div class="subtabs">${[['overview','Visão geral'],['kit','Kit e rastros'],['eidolons','Eidolons'],['relics','Relíquias'],['teams','Equipes']].map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';refresh()">${t}</button>`).join('')}</div>
${tab==='overview'?profileOverview(id,b):tab==='eidolons'?profileEidolons(id,b):tab==='kit'?profileKit(id,b):tab==='relics'?profileRelics(id,b):profileTeams(id,b)}${foot()}`}
function profileOverview(id,b){let c=lookup(id);return `<div class="row wrap space-between"><strong style="font-size:14px">Seu personagem</strong>${b?`<button class="button secondary sm" onclick="editBuild('${id}')">${ic('settings')} Editar atributos</button>`:`<button class="button sm" onclick="addOwned('${id}')">${ic('plus')} Adicionar à conta</button>`}</div>
<div class="mt14 grid2">${[['PV','pv'],['ATQ','atk'],['DEF','def'],['VEL','spd'],['Chance CRIT','crit'],['Dano CRIT','cdmg'],['Efeito de Quebra','break'],['Reg. de Energia','energy']].map(([l,k])=>`<div class="statline"><span>${l}</span><strong>${b?.[k]!==undefined?formatStat(b[k],k):'—'}</strong></div>`).join('')}</div>
${section('Eidolons','Toque em qualquer um')}<div class="eid-row">${Array.from({length:6},(_,i)=>eidoButton(id,i+1,b)).join('')}</div>
${section('Seu cone de luz','Registro atual')}<div class="card card-body"><strong>${esc(b?.cone||'Ainda não cadastrado')}</strong><p class="small muted" style="margin:5px 0 0">${b?'Sobreposição S'+b.s:'Registre seu cone para completar a ficha.'}</p></div>
${section('Nexia analisa','Baseado na sua ficha')}<div class="nexia-note"><img src="assets/nexia.webp" alt="Nexia"><div><b>NEXIA · LEITURA DE BUILD</b><p>${esc(buildAdvice(id,b))}</p></div></div><div class="note mt14">Atributos do print não equivalem automaticamente a uma nota de meta. A análise final exige relíquias, rotas de habilidades e condições reais de combate.</div>`}
function formatStat(v,k){let x=Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1});return /^(crit|cdmg|break|energy|euphoria)$/.test(k)?x+'%':x}
function eidoFallback(id,n){return (id==='1505'||(id==='1503'&&n<=2))?`assets/ranks/${id}_${n}.webp`:(localImage[id]||imgSrc(id,'icon'))}
function wikiEido(id,n){let names={'1505':'Evanescia','1503':'Pearl','1507':'Mortenax Blade','1205':'Blade'};let name=names[id]||lookup(id).name;return `https://honkai-star-rail.fandom.com/wiki/Special:Redirect/file/${encodeURIComponent('Character '+name+' Eidolon '+n+'.png')}`}
function eidoVisual(id,n,large=false){
 const art=EIDO_ART[id]?.[n-1];const fallback=artRank(id,n);
 if(large){return art?`<figure class="fragment-figure"><img class="fragment-art" src="${esc(art)}" alt="Arte original do Eidolon ${n} de ${esc(lookup(id).name)}" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<p>Arte indisponível na fonte neste momento.</p>')"><figcaption>Fragmento original do Eidolon ${n} · arte do jogo</figcaption></figure>`:`<div class="fragment-empty"><span>◇ E${n}</span><p>A arte individual deste Eidolon ainda não foi verificada na biblioteca. O ícone não será ampliado no lugar dela.</p></div>`}
 return art?`<img src="${esc(art)}" loading="lazy" alt="Fragmento do Eidolon ${n}" onerror="this.src='${esc(fallback)}'">`:`<img src="${esc(fallback)}" loading="lazy" alt="Ícone do Eidolon ${n}" onerror="this.style.opacity='.08'">`;
}
function enhanceEidoImages(root=document){root.querySelectorAll('img[data-remote]').forEach(el=>{if(el.dataset.requested)return;el.dataset.requested='1';let r=new Image();r.onload=()=>{if(el.isConnected)el.src=r.src};r.src=el.dataset.remote})}

function eidoButton(id,n,b){const e=b?.e||0,rank=rankInfo(id,n);return `<button class="portrait-eido ${e>=n?'unlocked':''}" aria-label="Ver Eidolon ${n}, ${esc(rank.name)}" onclick="showEido('${id}',${n})">${eidoVisual(id,n,false)}<span class="count">E${n}</span>${e>=n?'':`<span class="lock">○</span>`}</button>`}
function profileEidolons(id,b){return `${head('ECOS DO DESTINO','Galeria de Eidolons','Cada fragmento abre a arte individual, a descrição do jogo e uma leitura útil da Nexia.')}
<div class="fragment-gallery">${Array.from({length:6},(_,i)=>{let n=i+1,x=rankInfo(id,n),active=b?.e>=n;return `<button class="fragment-card ${active?'active':''}" onclick="showEido('${id}',${n})"><div class="fragment-card-art">${eidoVisual(id,n,false)}<span>E${n}</span></div><div class="fragment-caption"><b>${esc(x.name)}</b><small>${active?'✦ Desbloqueado':'○ Bloqueado'} · Ver detalhes</small></div></button>`}).join('')}</div><p class="note mt14">As artes completas estão verificadas inicialmente para Pearl e Mortenax Blade. Personagens sem imagem validada mostram o ícone original em tamanho normal, não uma falsa ilustração ampliada.</p>`}
function getSkills(id){let c=lookup(id);let s=Object.values(gameData.skills).filter(x=>x.id?.startsWith(id)&&x.type_text&&x.type_text!=='');if(s.length)return s.filter(x=>/^(ATQ Básico|Perícia|Perícia Suprema|Talento|Técnica|Perícia da Euforia)$/.test(x.type_text)).map(x=>({name:x.name,type:x.type_text,desc:x.desc,params:x.params,icon:x.icon,id:x.id}));let v=SEED_SKILLS[id]||[];return v.map((x,i)=>({id:id+'0'+(i+1),type:x[0],name:x[1],desc:x[2],icon:'icon/skill/'+x[3],params:null,seed:true}))}
function resolveDesc(s){let str=s.desc||'';if(!s.params)return str;let level=s.params[Math.max(0,Math.min(skillLv-1,s.params.length-1))]||s.params[0];return str.replace(/#(\d+)\[(?:i|f\d*)\]/g,(match,n,pos,whole)=>{let x=level[+n-1];if(x===undefined)return match;let percentage=whole[pos+match.length]==='%';let value=percentage?x*100:x;return (+value).toLocaleString('pt-BR',{maximumFractionDigits:1})})}
function profileKit(id){let sk=getSkills(id);return `${head('FICHA TÉCNICA','Kit de combate','Descrição com números e condições do jogo, acompanhada de uma leitura simplificada.')}<div class="card card-body"><div class="row space-between"><div><strong class="small">Nível de referência</strong><p class="small muted" style="margin:3px 0">Escolha o nível das habilidades</p></div><select class="select" style="max-width:96px" onchange="skillLv=+this.value;refresh()">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${skillLv===i+1?'selected':''}>Nv. ${i+1}</option>`).join('')}</select></div></div>
${section('Habilidades','Toque para explorar')}${sk.length?sk.map((x,i)=>`<button class="kit-row" onclick="showSkill('${id}',${i})"><img loading="lazy" src="${esc(STR+x.icon)}" onerror="this.style.opacity=.1" alt="Ícone"><div style="flex:1;min-width:0"><small class="accent">${esc(x.type)}</small><strong>${esc(x.name)}</strong><small>${x.seed?'Resumo local · abra para ver':'Dados do jogo · abra para ver multiplicadores'}</small></div>${ic('chevron','arrow')}</button>`).join(''):'<div class="note">Kit indisponível nesta cópia offline. Use “Atualizar catálogo” no Radar para carregar descrições e multiplicadores de personagens adicionais.</div>'}
${section('Rastros e condições','Leitura completa')}<div class="note">Os rastros maiores e os bônus secundários exigem a sincronização da árvore de habilidades; a aba de Kit traz agora as habilidades e a página de Eidolons as seis melhorias. Níveis específicos podem variar conforme Eidolons e buffs.</div>`}
function profileRelics(id,b){let names=['Cabeça','Mãos','Corpo','Pés','Esfera Plana','Corda de Ligação'];let relics=b?.relics||{};return `${head('EQUIPAMENTO','Relíquias','Cadastre os seis espaços com o mesmo cuidado do jogo. As peças ficam associadas à sua build.')}
<div class="grid2">${names.map((n,i)=>{let x=relics[i]||{};return `<button class="list-card" style="text-align:left" onclick="editRelic('${id}',${i})"><span class="eyebrow">0${i+1} · ${n}</span><div style="margin:14px 0;font:23px var(--heading)">${x.main?esc(x.main):'Não registrado'}</div><small class="muted">${x.set?esc(x.set)+' · ':''}${x.value?esc(x.value):'Toque para cadastrar'}</small></button>`}).join('')}</div><div class="note mt14">Próxima etapa: identificação automática de conjunto, atributos principais e substats a partir do print. Por enquanto, você pode registrar tudo manualmente sem perder as alterações.</div>`}
function profileTeams(id,b){return `${head('FORMAÇÕES','Sinergias e equipes','Use os personagens cadastrados para montar suas formações e levar o resultado ao Endgame.')}<div class="card card-body"><p class="small muted">Equipe rápida sugerida por função e disponibilidade:</p><div class="team-slots">${[id,...owned().map(([i])=>i).filter(i=>i!==id).slice(0,3)].map(i=>`<button class="team-slot" onclick="openProfile('${i}')">${pimg(i)}<span>${portraitName(i)}</span></button>`).join('')}</div><button class="button full mt14" onclick="route('endgame')">Abrir planejador de Endgame ${ic('chevron')}</button></div><div class="note mt14">Esta composição é uma seleção do seu inventário, não uma recomendação otimizada. A Nexia não vai atribuir desempenho sem validar funções, velocidade e mecânicas.</div>`}
function explain(text,context=''){const s=(text||'').toLowerCase();let notes=[];
if(/pen de res|res a todos os tipos/.test(s))notes.push('Reduz o impacto da resistência elemental do inimigo na sua composição; o ganho real depende da resistência dele e de outros efeitos de PEN.');
if(/ignora.*def|def.*reduzida|reduz.*def/.test(s))notes.push('Facilita o dano contra alvos resistentes, mas a eficiência depende dos outros redutores de DEF e do nível do inimigo.');
if(/dano crit|chance.*crit/.test(s))notes.push('O efeito aumenta seu potencial crítico; observe os limites de Chance CRIT e a proporção com seus buffs em combate.');
if(/energia|perícia suprema/.test(s))notes.push('Pode alterar a frequência da Suprema e a rotação, principalmente em combates curtos ou com geração extra de Energia.');
if(/ataque extra/.test(s))notes.push('Interage com efeitos de Ataque Extra; confira quais habilidades realmente contam como Ataques Extras antes de montar a equipe.');
if(/ação|rodada extra|avanç/.test(s))notes.push('Pode aumentar o número de ações disponíveis por ciclo, mas exige conferir a ordem de VEL e as condições de ativação.');
if(/cura|pv|dano fatal|restaur/.test(s))notes.push('Impacta sobrevivência e estabilidade da equipe. Mais sustentação pode compensar menos dano em lutas longas.');
if(/nv\. da|nível da/.test(s))notes.push('Melhora o nível de habilidades: o retorno costuma depender de quais habilidades são mais usadas pela personagem.');
if(/galhofa|euforia|mandou bem|piada/.test(s))notes.push('Esse efeito participa do sistema de Euforia: acompanhe a geração e o consumo dos recursos para não desperdiçar ativações.');
if(/75%/.test(s)&&context==='1507')notes.push('No E2 de Mortenax Blade, fique atento à classificação de Ataque Extra na Suprema; isso permite interações novas, mas não significa que todo bônus já esteja ativo fora das condições especificadas.');
return notes.length?notes.slice(0,3).join(' '):'Esta melhoria modifica uma condição específica do kit. Leia a ativação, a duração e a equipe necessária antes de decidir pelo investimento; ainda não existe cálculo validado de ganho percentual para a sua conta.'}
function buildAdvice(id,b){if(!b)return 'Adicione o personagem à conta para receber observações de investimento.';
if(id==='1503'){const speed=+b.spd||0,d=+b.def||0;return `Pearl E${b.e}S${b.s}: ${d.toLocaleString('pt-BR')} DEF e ${speed} VEL. ${d>=2400?'Você já supera o requisito de 2.400 DEF do rastro Percepção Total.':'Seu DEF está abaixo do requisito de 2.400 do rastro Percepção Total.'} ${speed>=160?'Se usar o conjunto Profeta de Alcance Distante, já alcança o patamar de 160 VEL para a condição mais alta do conjunto.':'Confira se vale alcançar 160 VEL para certos conjuntos.'} Seu E2 faz a Suprema influenciar a ordem de ação do resto da equipe de Euforia; portanto, o ajuste mais importante é a rotação conjunta, não empilhar DEF indefinidamente.`;}
if(id==='1505')return `Evanescia E${b.e}S${b.s}: ${b.crit}% Chance CRIT e ${b.cdmg}% Dano CRIT. O E1 habilita a ativação adicional da Perícia da Euforia pela Mestre Raposinha, enquanto o E2 amplia o ganho de Mandou Bem. A grande decisão é encaixar a geração de recursos e os buffs antes das Supremas, não perseguir apenas Dano CRIT na tela. Com ${b.spd} de VEL, compare a ordem dos seus suportes na equipe.`;
if(id==='1507')return `Mortenax Blade E${b.e}S${b.s}: avalie duração do Campo, geração de Carga e os efeitos de Ataque Extra. Com E2, Supremas ofensivas dos aliados podem receber benefícios de Ataque Extra e a Carga necessária cai para 7. Verifique os gatilhos exatos dos seus companheiros antes de estimar ganhos.`;
return `Nv. ${b.level} · E${b.e}S${b.s}. A próxima prioridade é registrar cone e seis relíquias, conferir condições dos rastros e ajustar a ordem de VEL conforme a equipe. Não há dados suficientes para uma nota competitiva.`;}
function nexiaDetail(id,n,desc){
const key=id+'-'+n;
const authored={
 '1503-1':{impacto:'O E1 tem duas funções: ampliar a Euforia da equipe conforme você reúne 2, 3 ou 4 integrantes desse Caminho e impedir até duas derrotas fatais por combate.',rotacao:'A diferença entre 3 e 4 personagens da Euforia é enorme: o bônus indicado passa de 20% para 60%. Não escolha o quarto integrante às cegas; compare com a função que você perde ao retirar um suporte.',alerta:'A proteção contra dano fatal tem limite de duas ativações por batalha, não duas por personagem.'},
 '1503-2':{impacto:'Seu E2 torna o Dano de Euforia dos aliados 15% mais galhofa, estende o Avanço Adiante da Suprema aos demais aliados de Euforia e dobra o ganho de Mandou Bem e Piada durante a rodada extra.',rotacao:'O segredo é usar a Suprema quando seus personagens de Euforia estiverem prontos para capitalizar o avanço. Com a Pearl a 161 de VEL, confira quem age antes e depois dela para não sobrepor avanços nem desperdiçar recursos.',alerta:'O efeito de avanço exclui a própria Pearl e o Arquétipo Estético; a rodada extra e o ganho dobrado seguem as condições escritas no kit. Não significa que a Suprema ficará disponível mais rápido automaticamente.'},
 '1505-1':{impacto:'O E1 oferece 20% de PEN de RES a todos os tipos e adiciona mais uma Perícia da Euforia após o ataque da Mestre Raposinha.',rotacao:'O ganho não é só dano direto: essa ativação extra também alimenta Mandou Bem, acelerando a engrenagem do talento. Planeje as ativações da Raposinha antes de usar a próxima Suprema.',alerta:'O ganho contra cada inimigo depende da resistência dele e dos outros bônus da equipe.'},
 '1505-2':{impacto:'O E2 adiciona 36% de Dano CRIT e amplifica o Mandou Bem convertido pelos rastros principais.',rotacao:'O valor aumenta quando seus aliados geram Mandou Bem em momentos que alimentam o ciclo da Evanescia. A ordem da equipe importa mais do que simplesmente apertar a Suprema assim que acende.',alerta:'Os rastros citados pelo Eidolon precisam estar ativos para a conversão extra.'},
 '1507-1':{impacto:'O E1 reduz a resistência de todos os inimigos em 20% enquanto o Campo existe e atrasa a contagem regressiva de Fúria Infinita depois da Perícia extra.',rotacao:'Ele ajuda a prolongar a janela em que Mortenax Blade está fortalecendo o time. Priorize a aplicação do Campo antes de concentrar os ataques mais fortes.',alerta:'Sem Campo ativo, o efeito de redução de RES não está garantido.'},
 '1507-2':{impacto:'O E2 faz com que Supremas que causem dano sejam tratadas como Ataques Extras e fornece 75% de bônus de Dano de Ataque Extra aos aliados. O limite da Carga do Blade também cai para 7.',rotacao:'É aqui que você procura sinergia com personagens que causam dano na Suprema: esses golpes podem receber benefícios ligados à categoria Ataque Extra. Use Supremas durante a janela do Campo e monitore a geração de Carga.',alerta:'A redação exige uma Suprema que cause dano; Supremas puramente de suporte não passam automaticamente a causar Ataque Extra. E o bônus de 75% não significa 75% a mais de dano final em todas as situações.'}
};
if(authored[key])return authored[key];
const s=(desc||'').toLowerCase(),a=[];let impacto='O Eidolon acrescenta uma condição ao kit: avalie primeiro a ativação e a duração, não apenas o número em destaque.';
if(/nv\. da|nível da/.test(s))impacto='Este Eidolon aumenta o nível de habilidades. O ganho real depende do multiplicador do nível adicional e de quais golpes você usa mais.';
else if(/def|resistência|pen de res|res a todos/.test(s))impacto='O efeito altera a defesa ou resistência do alvo. O ganho depende da defesa do inimigo e de outros redutores já presentes na equipe.';
else if(/energia|mandou bem|piada/.test(s))impacto='Esta melhoria muda a economia de recursos: ela pode antecipar ativações importantes em vez de apenas aumentar um multiplicador isolado.';
else if(/dano crítico|dano crit|chance de crit/.test(s))impacto='Esta melhoria reforça os atributos críticos. Compare com os bônus já ativos durante o combate, não apenas com os números da tela de personagem.';
let rotacao=/avanço|rodada extra|ação/.test(s)?'Observe a ordem de ações e a VEL efetiva dos quatro personagens antes de usar a habilidade que ativa o Eidolon.':'Identifique o evento que ativa o efeito e alinhe a janela com a habilidade de maior impacto do seu time.';
let alerta=/até|máxim/.test(s)?'Há um limite ou condição de acúmulo no texto; ultrapassá-lo não aumenta o efeito.':'Sem os demais rastros, buffs e equipamentos, não dá para converter esse efeito em uma porcentagem de ganho final confiável.';
return {impacto,rotacao,alerta};
}
function nexiaDetailHtml(id,n,desc){let d=nexiaDetail(id,n,desc);return `<div class="nexia-deep"><div class="nexia-deep-head"><img src="assets/nexia.webp" alt="Pom-Pom, assistente Nexia"><div><strong>NEXIA · ANÁLISE DE COMBATE</strong><small>Leitura prática baseada no kit, não geração de IA externa</small></div></div><div class="advice-stack"><div><b>✦ O que realmente muda</b><p>${esc(d.impacto)}</p></div><div><b>↗ Como aproveitar na rotação</b><p>${esc(d.rotacao)}</p></div><div><b>◇ Atenção à condição</b><p>${esc(d.alerta)}</p></div></div></div>`}

function tier(){return `${head('OBSERVATÓRIO DO META','Meta & Tier List','O meta precisa considerar modo, investimento, grupo de inimigos e os personagens que você realmente possui.')}
<div class="card card-body"><div class="eyebrow">SUA CONTA · VISÃO INICIAL</div>${owned().map(([id,b])=>`<button class="char-small mt10" onclick="openProfile('${id}')">${pimg(id)}<div style="min-width:0;flex:1"><strong>${portraitName(id)}</strong><small>E${b.e}S${b.s} · ${b.level}/80 · Ver ficha completa</small></div>${ic('chevron')}</button>`).join('')}<div class="nexia-note mt14"><img src="assets/nexia.webp"><div><b>ANTES DE CLASSIFICAR</b><p>Tier lists variam entre Memória do Caos, Pura Ficção, Sombra Apocalíptica e Arbitragem. Não vou atribuir T0/T1 fictício aos seus personagens só para preencher uma tabela.</p></div></div></div><div class="card card-body mt14"><strong>Comparador de investimentos</strong><p class="small muted">Compare as fichas E0/E2/E6 e identifique os efeitos reais dos Eidolons. O ganho percentual em combate ainda depende de testes por equipe.</p><div class="row wrap"><button class="button secondary sm" onclick="openProfile('1505')">Evanescia</button><button class="button secondary sm" onclick="openProfile('1503')">Pearl</button><button class="button secondary sm" onclick="openProfile('1507')">Mortenax Blade</button></div></div>${foot()}`}
function themes(){let p=lookup(state.theme),t=theme(state.theme),m=(state.themeVisuals||{})[state.theme]||'portrait';return `${head('ATELIÊ DO EXPRESSO','Theme Studio','Um personagem muda o universo do Nexus: direção artística, fontes, ornamentos, ícones, fundos e imagem de capa.')}
<div class="theme-feature"><div class="theme-feature-pic">${photo(state.theme,'theme-feature-art','hero')}</div><div class="theme-feature-top"><span class="eyebrow">✦ IDENTIDADE ATIVA</span><span class="badge success">Aplicada</span></div><div class="theme-feature-info"><small>◈ ${esc(t.style.toUpperCase())}</small><h2>${esc(p.name)}</h2><span>Estética exclusiva baseada na identidade do personagem</span></div></div>
<div class="theme-actions"><button class="button secondary full" onclick="setTheme('8001')">✦ Restaurar tema padrão · Caelus</button></div>
${section('Escolher imagem de conceito','Para o tema selecionado')}<div class="art-choice-grid">${[['portrait','Arte completa'],['preview','Visual alternativo'],['eidolon','Fragmento E6']].map(([k,l])=>`<button class="art-choice ${m===k?'selected':''}" ${k==='eidolon'&&!EIDO_ART[state.theme]?'disabled title="Arte ainda não catalogada"':''} onclick="chooseThemeArt('${k}')"><div class="art-mini">${k==='eidolon'&&EIDO_ART[state.theme]?`<img src="${esc(EIDO_ART[state.theme][5])}" alt="Fragmento E6">`:`<img src="${esc(imgSrc(state.theme,k==='preview'?'preview':'portrait'))}" alt="${esc(l)}">`}</div><small>${l}${k==='eidolon'&&!EIDO_ART[state.theme]?' · indisponível':''}</small></button>`).join('')}</div>
<div class="theme-spec"><span>Tipografia</span><strong>${({blade:'Titulação incisiva',floral:'Editorial delicada',marine:'Serena e fluida',night:'Celestial',hacker:'Terminal e digital',solar:'Clássica e solar',astral:'Expresso Astral'})[t.style]||'Astral'}</strong><span>Ornamento</span><strong class="accent theme-symbol">${({blade:'⚔',floral:'✿',marine:'〰',night:'☾',hacker:'⌘',solar:'☼'})[t.style]||'✦'}</strong></div>
${section('Elenco completo',`${CATALOG.length} identidades`)}<div class="catalog-search">${ic('search')}<input id="themeSearch" type="search" placeholder="Buscar qualquer personagem..." value="${esc(themeSearch)}" oninput="themeSearch=this.value;updateThemeGrid()"></div><div class="chips mt10"><button class="chip ${themeFilter==='all'?'active':''}" onclick="themeFilter='all';refresh()">Todos</button><button class="chip ${themeFilter==='owned'?'active':''}" onclick="themeFilter='owned';refresh()">Na minha conta</button><button class="chip ${themeFilter==='favorites'?'active':''}" onclick="themeFilter='favorites';refresh()">Destaques</button></div><div id="themeGrid" class="library-grid mt10">${makeThemeGrid()}</div><div class="note mt14">Os temas usam arte de jogo quando disponível; escolhas diferentes para cada personagem permanecem salvas no aparelho. A curadoria de motivos únicos continua em expansão, sem inventar ilustrações oficiais.</div>${foot()}`}
function chooseThemeArt(m){state.themeVisuals||={};state.themeVisuals[state.theme]=m;save();applyTheme();refresh();showToast('Imagem de conceito atualizada')}

function themeList(){let res=CATALOG.filter(c=>!themeSearch||c.name.toLowerCase().includes(themeSearch.toLowerCase()));if(themeFilter==='owned')res=res.filter(c=>state.characters[c.id]);if(themeFilter==='favorites')res=res.filter(c=>state.favorites.includes(c.id));return res}
function makeThemeGrid(){return themeList().map(c=>`<button class="library-card ${state.theme===c.id?'active':''}" onclick="setTheme('${c.id}')"><div class="face-placeholder">${c.name[0]}<img class="face" style="position:absolute;left:0;top:0" loading="lazy" src="${esc(imgSrc(c.id,'icon'))}" alt="${esc(c.name)}" onerror="this.style.display='none'"></div>${state.theme===c.id?'<span class="own-dot">✓ ATIVO</span>':''}<span class="char-name">${esc(c.name)}</span></button>`).join('')||'<div class="note" style="grid-column:1/-1">Nenhum personagem encontrado.</div>'}
function updateThemeGrid(){document.getElementById('themeGrid').innerHTML=makeThemeGrid()}
function setTheme(id){state.theme=id;save();applyTheme();refresh();window.scrollTo({top:0,behavior:'smooth'});showToast('Tema ativado: '+lookup(id).name)}
function botAnswer(q){const s=q.toLowerCase(),own=owned(),num=s.match(/\be\s*([1-6])\b/i),n=num?+num[1]:null;
 const id=/mortenax|blade/.test(s)?'1507':/pearl|pérola/.test(s)?'1503':/evanescia|vanessa/.test(s)?'1505':null;
 if(id&&n){const x=rankInfo(id,n),d=nexiaDetail(id,n,x.desc),b=ownedBuild(id);return `${portraitName(id)} · E${n} (${b&&b.e>=n?'desbloqueado':'não desbloqueado na sua conta'})\n\nO que muda: ${d.impacto}\n\nComo usar na rotação: ${d.rotacao}\n\nAtenção: ${d.alerta}\n\nDescrição do kit: ${x.desc}`}
 if(/^(oi|olá|bom dia|boa noite)[!?.\s]*$/.test(s))return 'Piu! Aqui é a Nexia. Posso comparar os efeitos dos seus Eidolons, explicar rotações e ler seu estoque; os dados de banners e metas precisam estar verificados antes de eu recomendar investimento.';
 if(id==='1507'){const d=nexiaDetail('1507',2,rankInfo('1507',2).desc);return `Seu Mortenax Blade E2S1 transforma Supremas ofensivas dos aliados em ataques classificados como Ataque Extra. ${d.impacto}\n\nRotação: ${d.rotacao}\n\nCondição: ${d.alerta}`}
 if(id==='1503'){const b=state.characters['1503'];if(!b)return 'Pearl não está cadastrada na sua conta.';const d=nexiaDetail('1503',2,rankInfo('1503',2).desc);return `Sua Pearl E${b.e}S${b.s} tem ${b.def} de DEF e ${b.spd} de VEL. O ponto forte do seu E2 não é apenas a DEF: ${d.impacto}\n\n${d.rotacao}`}
 if(id==='1505'){const b=state.characters['1505'];if(!b)return 'Evanescia não está cadastrada.';return `Evanescia E${b.e}S${b.s}: ${b.crit}% de Chance CRIT, ${b.cdmg}% de Dano CRIT e ${b.spd} VEL. A E1 ativa uma Perícia da Euforia extra com a Mestre Raposinha e a E2 acrescenta conversões de Mandou Bem; combine a ativação da Raposinha com os buffs da equipe antes da Suprema. Para comparar com builds competitivas, ainda preciso de relíquias e uma rotação verificadas.`}
 if(/farm|material|cálice|rastro|faltar/.test(s)){let needs=Object.entries(state.farm).map(([k,v])=>[materialLabels[k],Math.max(0,(+v.need||0)-(+v.have||0))]).filter(([,v])=>v>0);return needs.length?'Do estoque que você registrou ainda faltam: '+needs.map(([k,v])=>`${v} × ${k}`).join(', ')+'. A síntese converte 3 verdes em 1 azul e 3 azuis em 1 roxo. Sem taxa de drop oficial do Cálice não vou inventar a quantidade de runs.':'Não há faltas registradas. Para um cálculo útil, preencha o estoque e a meta do Farm Planner.'}
 if(/endgame|moc|ciclo|arbitragem|pura ficção|sombra/.test(s))return 'Na Arbitragem 4.6, as quatro etapas têm mecânicas distintas. Abra o desafio desejado para ver chefe, fraquezas, ondas e como planejar a sequência. Não existe estimativa honesta de 0 ciclo sem HP, comportamento do inimigo, buffs, relíquias e rotação dos seus quatro personagens.';
 if(/conta|quem investir|pull|banner|prioridade/.test(s))return `Sua ficha local tem ${own.length} personagem(ns), ${own.reduce((a,[,v])=>a+(+v.e||0),0)} Eidolons e duas builds detalhadas de referência. Evanescia E6S1 e Pearl E2S1 são investimentos relevantes na Euforia, mas não vou indicar novos banners sem conhecer seus demais personagens e o conteúdo confirmado da rotação atual.`;
 return `Minha biblioteca ainda não consegue interpretar livremente: “${q}”. Eu funciono por regras e dados do kit, não por integração com o ChatGPT. Experimente perguntar “Como usar a Pearl E2?” ou “O que faz o Mortenax Blade E2?” — nesses casos consigo explicar gatilhos, rotações e limitações.`;
}
function nexia(){return `${head('VAGÃO DE CONSULTAS','Nexia · Seu assistente','O Pom-Pom acompanha suas dúvidas sobre personagens, farm e equipes, com respostas baseadas na conta.')}
<div class="card card-body"><div class="row"><div class="avatar lg"><img src="assets/nexia.webp" alt="Nexia com aparência de Pom-Pom"></div><div><strong style="font:400 24px var(--heading)">Nexia está a bordo!</strong><p class="small muted" style="margin:4px 0">Regras locais • sem custo • sem IA externa</p></div></div><div class="note mt14">A Nexia ainda não está conectada ao ChatGPT ou a um modelo online. Ela consulta o inventário que você registrou e explica as informações disponíveis; não simula raciocínio de IA real.</div>
<div class="chat" id="chatList">${state.chat.length?state.chat.map(o=>`<div class="bubble ${o.role}">${esc(o.msg)}</div>`).join(''):'<div class="bubble bot">Piu! Sua viagem pelo Nexus começou! Quer entender algum Eidolon, comparar suas builds ou planejar o farm?</div>'}</div>
<div class="chips mt10">${['O que meu Mortenax Blade E2 faz?','Analise minha Evanescia','O que falta no farm?','Como avaliar minha conta?'].map(q=>`<button class="chip" onclick="quickAsk('${q}')">${q}</button>`).join('')}</div><div class="message-line mt14"><input class="input" id="nexQuestion" placeholder="Pergunte à Nexia..." onkeydown="if(event.key==='Enter')sendAsk()"><button class="button" aria-label="Enviar mensagem" onclick="sendAsk()">${ic('chevron')}</button></div></div>${foot()}`}
function quickAsk(q){state.chat.push({role:'user',msg:q},{role:'bot',msg:botAnswer(q)});state.chat=state.chat.slice(-50);save();refresh();setTimeout(()=>{let el=document.getElementById('chatList');if(el)el.scrollTop=el.scrollHeight},15)}
function sendAsk(){let inp=document.getElementById('nexQuestion');if(inp&&inp.value.trim())quickAsk(inp.value.trim())}
function settings(){return `${head('PAINEL DE CONTROLE','Configurações','Seu Nexus funciona sem login e mantém informações localmente, com opção de backup.')}
<div class="card card-body"><div class="eyebrow">BACKUP E SEGURANÇA</div><h3 style="font:400 24px var(--heading)">Seus dados, seu controle</h3><p class="small muted">Salve um JSON antes de trocar de navegador, limpar o histórico ou publicar no GitHub. O GitHub não precisa receber seu inventário pessoal.</p><button class="button full" onclick="exportBackup()">${ic('download')} Exportar backup da conta</button><label class="button secondary full mt10" style="cursor:pointer">${ic('upload')} Importar backup JSON<input style="display:none" type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></label></div>
<div class="card card-body mt14"><div class="eyebrow">ORIGEM DO CATÁLOGO</div><p class="small muted">StarRailRes · índices de habilidades, Eidolons e personagens em português. Os direitos dos personagens e artes são da HoYoverse. Nenhum link de navegação externa é exigido para usar os módulos.</p><button class="button secondary full" onclick="loadGameData(true)">${ic('refresh')} Sincronizar conteúdo</button><div class="note mt14">A sincronização a cada três horas ainda não foi implementada. Ela poderá rodar automaticamente após a publicação e configuração de um fluxo gratuito no GitHub Actions, respeitando limites e disponibilidade.</div></div>
<div class="card card-body mt14"><div class="eyebrow">STATUS DO DESENVOLVIMENTO</div>${[['Operacional','Menu, responsividade e temas'],['Operacional','Fichas, Eidolons e pop-ups'],['Operacional','Importar/exportar backup JSON'],['Parcial','Kits e habilidades (catálogo online)'],['Parcial','Farm Planner com conversão 3:1'],['Parcial','Equipe e registro de Endgame'],['Em construção','Importação automática dos prints'],['Em construção','Simulador avançado de ciclos'],['Em construção','Nexia com IA conversacional'],['Em construção','Atualizações agendadas']].map(([status,n])=>`<div class="row space-between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="small">${n}</span><span class="badge ${status==='Operacional'?'success':''}">${status}</span></div>`).join('')}</div>${foot()}`}
function exportBackup(){let data={app:'anderus-nexus',version:3,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='anderus-nexus-backup-v03.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);showToast('Backup exportado')}
async function importBackup(file){if(!file)return;try{let data=JSON.parse(await file.text()),b=data.state||data;if(!b?.characters||typeof b.characters!=='object')throw Error('Arquivo não contém um perfil válido');if(!confirm('Substituir os dados registrados por este backup?'))return;state=Object.assign(safeCopy(initial),b);state.endgameResults||={};state.themeVisuals||={};state.customBanners||={};save();route('home');showToast('Seu backup foi restaurado')}catch(e){alert('Não foi possível importar: '+e.message)}}
async function fetchCatalogueFile(endpoint){const urls=[`${MIRROR}index_min/pt/${endpoint}.json`,`${STR}index_min/pt/${endpoint}.json`];for(const url of urls){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('Status '+r.status);let data=await r.json();clearTimeout(timer);if(data&&Object.keys(data).length)return data}catch(e){clearTimeout(timer)}}throw Error('Fonte indisponível: '+endpoint)}
async function loadGameData(manual=false){if(manual){syncStatus='loading';showToast('Consultando catálogo...')}let data=await Promise.allSettled(['characters','character_ranks','character_skills'].map(fetchCatalogueFile));let successes=0;data.forEach((x,i)=>{if(x.status!=='fulfilled')return;successes++;const key=['chars','ranks','skills'][i];gameData[key]=x.value;if(key==='chars'){for(const c of Object.values(x.value)){if(!CATALOG.find(p=>p.id===c.id)){CATALOG.push({id:c.id,name:c.name,tag:c.tag,rarity:c.rarity,icon:c.icon,portrait:c.portrait,preview:c.preview})}}}});syncStatus=successes?'online':'local';if(manual)showToast(successes?`Catálogo atualizado (${successes}/3 conjuntos)`:'Sem conexão com fonte. Mantive os dados offline.');if(manual)refresh()}
function render(){applyTheme();renderNav();renderMenu();document.getElementById('stage').innerHTML=resolveAssets(page==='home'?home():page==='library'?library():page==='profile'?profile():page==='endgame'?endgame():page==='farm'?farm():page==='radar'?radar():page==='tier'?tier():page==='themes'?themes():page==='nexia'?nexia():settings());document.getElementById('nexFab').innerHTML=resolveAssets(`<img src="assets/nexia.webp" alt="Conversar com Nexia"><span class="dot"></span>`);enhanceEidoImages(document.getElementById('stage'))}
window.addEventListener('DOMContentLoaded',()=>{render();loadGameData(false)});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
